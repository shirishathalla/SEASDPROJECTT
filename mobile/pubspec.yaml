name: docuvault
description: AI-Powered Privacy-First Personal Digital Document Wallet
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  dio: ^5.4.1
  local_auth: ^2.1.8
  flutter_secure_storage: ^9.0.0
  cryptography: ^2.7.0
  camera: ^0.10.5+9
  google_mlkit_text_recognition: ^0.11.0
  qr_flutter: ^4.1.0
  image_picker: ^1.0.7
  intl: ^0.19.0
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
